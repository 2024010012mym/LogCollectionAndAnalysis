name: PR 信息收集

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: pr-info-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: 确认 PR 事件
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          mkdir -p pr-info
          printf '%s\n' "$PR_NUMBER" > pr-info/pr_number.txt
          printf '%s\n' "$HEAD_SHA" > pr-info/head_sha.txt
          printf '%s\n' "$HEAD_REPOSITORY" > pr-info/head_repository.txt
          printf '%s\n' "$HEAD_BRANCH" > pr-info/head_branch.txt
          printf '收到 PR #%s，提交 %s\n' "$PR_NUMBER" "$HEAD_SHA"

      - name: 上传受限 PR 元数据
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: pr-info
          path: pr-info/
          retention-days: 1
          if-no-files-found: error
